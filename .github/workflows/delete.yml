
name: Delete All Files With Ease

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Confirmation
        id: verify
        run: |
          if [ ! -f verify.yml ]; then
            echo "Confirmation file not found!"
            exit 1
          fi

          value=$(cat verify.yml)

          if [ "$value" = "y" ]; then
            echo "confirmed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Confirmation rejected!"
            exit 1
          fi

      - name: Delete Repository Contents
        if: steps.verify.outputs.confirmed == 'true'
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' -exec rm -rf -- {} +

      - name: Commit Changes
        if: steps.verify.outputs.confirmed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Delete all repository contents" || exit 0
          git push
          
